<!DOCTYPE html>
<html lang="en">
<head> 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPTV Online Player</title>
    <!-- Plyr CSS for a professional video player UI -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/plyr@3/dist/plyr.css" />
    <!-- HLS.js and Plyr Script -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/plyr@3"></script>
    <style>
        :root {
            --bg-color: #f8fafc;
            --panel-bg: #ffffff;
            --border-color: #e2e8f0;
            --primary-color: #2563eb;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --hover-bg: #f1f5f9;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar Panel */
        .sidebar {
            width: 380px;
            background-color: var(--panel-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            height: 100%;
            z-index: 10;
        }

        .sidebar-section {
            padding: 15px;
            border-bottom: 1px solid var(--border-color);
        }

        .sidebar-section h3 {
            font-size: 0.9rem;
            color: var(--text-main);
            margin-bottom: 8px;
            font-weight: 600;
        }

        .search-container {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .search-bar-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .search-bar-row span {
            font-size: 0.755rem;
            color: var(--text-muted);
        }

        input[type="text"], input[type="url"] {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus, input[type="url"]:focus {
            border-color: var(--primary-color);
        }

        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.9rem;
            width: 100%;
            transition: background 0.2s;
        }

        .btn:hover {
            background-color: #1d4ed8;
        }

        /* Channel List View */
        .channel-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .channel-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            border-radius: 6px;
            cursor: pointer;
            margin-bottom: 4px;
            border: 1px solid transparent;
            transition: background 0.15s, border-color 0.15s;
        }

        .channel-item:hover {
            background-color: var(--hover-bg);
        }

        .channel-item.active {
            background-color: #eff6ff;
            border-color: #bfdbfe;
        }

        .channel-info {
            display: flex;
            align-items: center;
            gap: 10px;
            overflow: hidden;
        }

        .channel-name {
            font-size: 0.9rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .channel-actions {
            display: flex;
            gap: 8px;
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .channel-actions span:hover {
            color: var(--primary-color);
        }

        /* Main Content View */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            background-color: #0f172a;
        }

        .player-header {
            background-color: #ffffff;
            padding: 12px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .player-header h2 {
            font-size: 1.1rem;
            color: var(--text-main);
        }

        .stream-url-box {
            display: flex;
            align-items: center;
            background: var(--bg-color);
            padding: 6px 10px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 0.8rem;
            color: var(--text-muted);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .video-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            background: #000;
            overflow: hidden;
        }

        video {
            width: 100%;
            height: 100%;
        }

        .player-footer-bar {
            background: #ffffff;
            padding: 8px 20px;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .player-footer-bar a {
            color: var(--text-muted);
            text-decoration: none;
            margin-left: 15px;
        }

        .player-footer-bar a:hover {
            color: var(--primary-color);
        }
    </style>
</head>
<body>

    <!-- Sidebar Component -->
    <div class="sidebar">
        <!-- Search Section -->
        <div class="sidebar-section">
            <div class="search-container">
                <div class="search-bar-row">
                    <h3>Channel List</h3>
                    <span id="channelCount">0 channels</span>
                </div>
                <input type="text" id="searchInput" placeholder="Search channels..." onkeyup="filterChannels()">
            </div>
        </div>

        <!-- Channel Display List -->
        <div class="channel-list" id="channelListContainer">
            <!-- Dynamically injected channels -->
        </div>

        <!-- Load M3U Playlist Section -->
        <div class="sidebar-section">
            <h3>Load M3U Playlist</h3>
            <div style="display: flex; flex-direction: column; gap: 8px;">
                <input type="url" id="m3uUrlInput" placeholder="https://example.com/playlist.m3u">
                <button class="btn" onclick="loadM3UFromURL()">Load M3U</button>
            </div>
        </div>

        <!-- Add Custom Channel Section -->
        <div class="sidebar-section" style="border-bottom: none;">
            <h3>Add Custom Channel</h3>
            <div style="display: flex; flex-direction: column; gap: 8px;">
                <input type="text" id="customName" placeholder="Channel Name">
                <input type="url" id="customUrl" placeholder="Stream URL (.m3u8)">
                <button class="btn" onclick="addCustomChannel()">Add Channel</button>
            </div>
        </div>
    </div>

    <!-- Main Player Area -->
    <div class="main-content">
        <div class="player-header">
            <h2 id="currentChannelTitle">Select a channel</h2>
            <div class="stream-url-box" id="currentStreamUrlDisplay">Current stream: None</div>
        </div>

        <div class="video-container">
            <video id="player" controls playsinline></video>
        </div>

        <div class="player-footer-bar">
            <span id="footerStatus">Ready</span>
            <div>
                <a href="#" onclick="copyStreamUrl(); return false;">Copy URL</a>
                <a href="#" onclick="toggleFullscreen(); return false;">Fullscreen</a>
            </div>
        </div>
    </div>

    <script>
        // Initial sample playlist data
        let channels = [
            { name: "China Travel (1080p)", url: "https://amg0314-amg0314c7-distrotv-us-10219.playouts.now.amagi.tv/playlist/amg0314-cgtn-cgtnchinatravel-distrotvus/playlist.m3u8" },
            { name: "Al Jazeera English", url: "https://live-hls-web-aje.getaj.net/AJE/index.m3u8" },
            { name: "NASA TV", url: "https://nasa-i.akamaihd.net/hls/live/509607/NASA-TV-HD/master.m3u8" }
        ];

        let player = null;
        let hls = null;
        let currentActiveUrl = "";

        // Initialize Plyr player
        document.addEventListener('DOMContentLoaded', () => {
            player = new Plyr('#player', {
                controls: ['play-large', 'play', 'progress', 'current-time', 'mute', 'volume', 'settings', 'fullscreen'],
                settings: ['quality', 'speed']
            });
            renderChannels(channels);
            if(channels.length > 0) {
                playChannel(channels[0].url, channels[0].name);
            }
        });

        // Render channel list onto sidebar
        function renderChannels(list) {
            const container = document.getElementById('channelListContainer');
            container.innerHTML = '';
            
            document.getElementById('channelCount').innerText = `${list.length} channels`;

            list.forEach((channel, index) => {
                const item = document.createElement('div');
                item.className = 'channel-item';
                if (channel.url === currentActiveUrl) {
                    item.classList.add('active');
                }

                item.innerHTML = `
                    <div class="channel-info">
                        <span class="channel-name">${channel.name}</span>
                    </div>
                    <div class="channel-actions">
                        <span>♡</span>
                        <span>✕</span>
                    </div>
                `;

                item.onclick = (e) => {
                    // Prevent triggering if action buttons are clicked directly
                    if(e.target.tagName === 'SPAN' && e.target.innerText !== '') return;
                    playChannel(channel.url, channel.name);
                    
                    // Update active UI classes
                    document.querySelectorAll('.channel-item').forEach(el => el.classList.remove('active'));
                    item.classList.add('active');
                };

                container.appendChild(item);
            });
        }

        // Search/Filter Channels
        function filterChannels() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = channels.filter(ch => ch.name.toLowerCase().includes(query));
            renderChannels(filtered);
        }

        // Core stream playing function using HLS.js
        function playChannel(url, name) {
            currentActiveUrl = url;
            document.getElementById('currentChannelTitle').innerText = name;
            document.getElementById('currentStreamUrlDisplay').innerText = `Current stream: ${url}`;
            document.getElementById('footerStatus').innerText = `Playing: ${name}`;

            const video = document.getElementById('player');

            if (Hls.isSupported()) {
                if (hls) {
                    hls.destroy();
                }
                hls = new Hls();
                hls.loadSource(url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, () => {
                    video.play().catch(err => console.log("Autoplay blocked/failed:", err));
                });
                hls.on(Hls.Events.ERROR, (event, data) => {
                    if (data.fatal) {
                        document.getElementById('footerStatus').innerText = `Error loading stream`;
                    }
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = url;
                video.addEventListener('loadedmetadata', () => {
                    video.play();
                });
            }
        }

        // Add custom manual channel
        function addCustomChannel() {
            const name = document.getElementById('customName').value.trim();
            const url = document.getElementById('customUrl').value.trim();

            if (!name || !url) {
                alert('Please fill out both channel name and stream URL.');
                return;
            }

            channels.push({ name, url });
            renderChannels(channels);

            document.getElementById('customName').value = '';
            document.getElementById('customUrl').value = '';
            document.getElementById('footerStatus').innerText = `Added custom channel: ${name}`;
        }

        // Load M3U Playlist parser from external link (handles standard #EXTINF formats)
        async function loadM3UFromURL() {
            const m3uUrl = document.getElementById('m3uUrlInput').value.trim();
            if (!m3uUrl) {
                alert('Please enter a valid M3U playlist URL.');
                return;
            }

            document.getElementById('footerStatus').innerText = 'Loading playlist...';

            try {
                // Using a standard CORS proxy or direct fetch if allowed by server
                const response = await fetch(m3uUrl);
                const text = await response.text();
                parseM3UText(text);
            } catch (error) {
                console.error("Fetch error:", error);
                // Fallback attempt via public cors proxy if direct fetch blocks
                try {
                    const proxyUrl = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(m3uUrl);
                    const response = await fetch(proxyUrl);
                    const text = await response.text();
                    parseM3UText(text);
                } catch (err2) {
                    alert('Failed to load M3U playlist due to network or CORS restrictions.');
                    document.getElementById('footerStatus').innerText = 'Playlist load failed';
                }
            }
        }

        // Simple M3U text parser
        function parseM3UText(data) {
            const lines = data.split('\n');
            let parsedChannels = [];
            let currentName = "";

            for (let i = 0; i < lines.length; i++) {
                let line = lines[i].trim();
                if (line.startsWith('#EXTINF:')) {
                    let parts = line.split(',');
                    if (parts.length > 1) {
                        currentName = parts[parts.length - 1].trim();
                    }
                } else if (line && !line.startsWith('#')) {
                    if (!currentName) {
                        currentName = `Channel ${parsedChannels.length + 1}`;
                    }
                    parsedChannels.push({ name: currentName, url: line });
                    currentName = "";
                }
            }

            if (parsedChannels.length > 0) {
                channels = parsedChannels;
                renderChannels(channels);
                playChannel(channels[0].url, channels[0].name);
                document.getElementById('footerStatus').innerText = `Successfully loaded ${channels.length} channels!`;
            } else {
                alert('No valid streams found in the M3U file.');
            }
        }

        // Utility features
        function copyStreamUrl() {
            if (currentActiveUrl) {
                navigator.clipboard.writeText(currentActiveUrl);
                document.getElementById('footerStatus').innerText = 'Stream URL copied to clipboard!';
            }
        }

        function toggleFullscreen() {
            if (player) {
                player.fullscreen.toggle();
            }
        }
    </script>
</body>
</html>
