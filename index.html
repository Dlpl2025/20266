   <script>
        var video = document.getElementById('video');
        var hls = new Hls();

        function changeChannel(url) {
            if (Hls.isSupported()) {
                hls.loadSource(url);
                hls.attachMedia(video);
                video.play();
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = url;
                video.play();
            }
        }

        // শুরুতে প্রথম চ্যানেল লোড করা
        changeChannel(document.getElementById('channelSelect').value);
